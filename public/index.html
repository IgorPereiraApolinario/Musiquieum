<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiquieum - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-info neon-border">
        <div class="container">
            <a class="navbar-brand neon-text font-weight-bold" href="index.html">Musiquieum</a>
        </div>
    </nav>

    <main class="container my-5">
        <section id="destaques-section" class="mb-5">
            <h2 class="text-center mb-4 neon-text-blue">Artistas em Destaque</h2>
            <div id="carouselDestaques" class="carousel slide neon-box" data-bs-ride="carousel">
                <div class="carousel-inner" id="carousel-inner-content">
                    </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestaques" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselDestaques" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próxima</span>
                </button>
            </div>
        </section>

        <hr class="border-info my-5">

        <section id="catalogo-section">
            <h2 class="text-center mb-4 neon-text-pink">Acervo Completo</h2>
            <div class="row g-4" id="cards-container">
                </div>
        </section>
    </main>

    <footer class="bg-black py-4 border-top border-info text-center">
        <div class="container">
            <p class="mb-0 neon-text-blue">Desenvolvido por: <strong>Igor Pereira Apolinário</strong></p>
            <p class="mb-0 text-secondary">Estudante de Engenharia de Software - PUC Minas</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
